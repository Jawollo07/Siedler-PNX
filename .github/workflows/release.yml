name: Build & Release

on:
  push:
    branches:
      - beta
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          fi

          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-SNAPSHOT)?$ ]]; then
            echo "Ungültige Version: $VERSION"
            exit 1
          fi

          PHASE="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "Planphase: $PHASE"

      - name: Validate release branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PHASE="${{ steps.version.outputs.phase }}"
          REQUIRED_BRANCH="beta"

          if (( PHASE >= 10 )); then
            REQUIRED_BRANCH="main"
          fi

          echo "Version $VERSION benötigt Branch $REQUIRED_BRANCH."
          echo "Getaggter Commit: $GITHUB_SHA"

          # Ein Tag kann unmittelbar vor dem Push des Branches erstellt werden.
          # Deshalb geben wir dem Branch bis zu 60 Sekunden Zeit, den Commit zu erreichen.
          for attempt in {1..12}; do
            git fetch origin "$REQUIRED_BRANCH" --quiet

            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$REQUIRED_BRANCH"; then
              echo "OK: $GITHUB_SHA ist in origin/$REQUIRED_BRANCH enthalten."
              exit 0
            fi

            if (( attempt < 12 )); then
              echo "Commit noch nicht in origin/$REQUIRED_BRANCH – warte 5 Sekunden (Versuch $attempt/12)."
              sleep 5
            fi
          done

          echo "Fehler: Version $VERSION muss aus dem Branch $REQUIRED_BRANCH veröffentlicht werden."
          exit 1

      - name: Set Maven version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mvn --batch-mode versions:set \
            -DnewVersion="${{ steps.version.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify build artifact
        run: |
          echo "Built artifacts:"
          ls -lah target/
          test -n "$(find target -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload beta build artifact
        if: github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@v4
        with:
          name: siedler-beta-${{ steps.version.outputs.version }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PHASE="${{ steps.version.outputs.phase }}"

          if (( PHASE < 10 )); then
            gh release create "$GITHUB_REF_NAME" \
              target/*.jar \
              --title "$GITHUB_REF_NAME (Beta)" \
              --prerelease \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              target/*.jar \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
