plugins {
    id 'java'
}

group = 'de.jawollo07.siedler'
version = '2.0.0-SNAPSHOT'

description = 'Siedler 2.0 - Native PowerNukkitX plugin'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'PowerNukkitX'
        url = uri('https://repo.powernukkitx.org/releases')
    }
    maven { url = uri('https://www.jitpack.io') }
    maven { url = uri('https://repo.opencollab.dev/maven-releases') }
    maven { url = uri('https://repo.opencollab.dev/maven-snapshots') }
}

dependencies {
    // Provided by the PowerNukkitX server at runtime.
    compileOnly 'org.powernukkitx:server:3.0.4'
}

jar {
    archiveBaseName = 'Siedler-2.0'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
