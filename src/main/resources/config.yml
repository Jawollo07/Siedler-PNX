# Siedler 2.0 configuration
# Defaults are intentionally conservative; gameplay systems are enabled incrementally.

storage:
  type: sqlite
sqlite:
  database: siedler.db
mysql:
  host: localhost
  port: 3306
  database: siedler
  username: root
  password: ""

teams:
  max-teams: 4
  max-players-per-team: 2
  default-tax-bonus: 1
  max-tax-bonus: 100

taxes:
  enabled: true
  interval-hours: 24
  emeralds-per-villager-per-bonus: 1

claims:
  enabled: true

monsters:
  token:
    enabled: true
    automatic: false
    max-active: 4
  outposts:
    enabled: true
    capture-seconds: 10
    radius: 12

soldiers:
  enabled: true
  max-level: 7

market:
  enabled: true
  currency: emerald

mines:
  enabled: true
  fuse-seconds: 1
  rearm-seconds: 15
