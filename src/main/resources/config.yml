# Siedler 2.0 configuration
# Defaults are intentionally conservative; gameplay systems are enabled incrementally.

storage:
  type: sqlite
sqlite:
  database: siedler.db
mysql:
  host: localhost
  port: 3306
  database: siedler
  username: root
  password: ""

teams:
  max-teams: 4
  max-players-per-team: 2
  default-tax-bonus: 1
  max-tax-bonus: 100

taxes:
  enabled: true
  interval-hours: 24
  emeralds-per-villager-per-bonus: 1

claims:
  protection:
    enabled: true
    interaction-blacklist:
      - minecraft:stone_button
      - minecraft:oak_button
      - minecraft:lever
economy:
  start-money: 0
  symbol: "€"
  name: "Eurolles"
elimination:
  block: minecraft:beacon
weakness:
  enabled: true
  duration: 0 # 0 is Infinite
  amplifier: 3
  isVisible: false
villagers:
  control:
    enabled: true
    # Maximum number of ordinary Villagers within the horizontal X/Z radius.
    max-per-radius: 5
    radius: 9

monsters:
  control:
    enabled: true
    # Only these entity identifiers are controlled. Leave empty to use the built-in hostile mob list.
    monsters: []
    # Completely prevents these mobs from spawning.
    blacklist:
      - minecraft:creeper
    # Spawn chance per attempted spawn in percent (0-100).
    # Format: entity-id:percent
    quotas:
      - minecraft:zombie:100
      - minecraft:skeleton:100
      - minecraft:creeper:0
      - minecraft:spider:100
      - minecraft:enderman:75
      - minecraft:witch:50
    default-quota-percent: 100
    # 0 disables the corresponding cap.
    max-per-chunk: 12
    max-per-world: 200
    # Worlds in this list never receive controlled monster spawns.
    world-blacklist: []
  token:
    enabled: true
    automatic: false
    max-active: 4
    entity: minecraft:zombie
    spawn-radius: 16
    spawn-interval-minutes: 30
    tax-bonus: 1
  outposts:
    enabled: true
    capture-seconds: 10
    radius: 12
    tax-bonus: 1
  raids:
    enabled: true
    automatic: true
    spawn-interval-minutes: 60
    waves: 3
    base-size: 3
    wave-growth: 2
    max-mobs-per-wave: 16
    spawn-radius: 20
    allow-vindicator: true
    allow-ravager: true

soldiers:
  enabled: false
  max-level: 7

market:
  enabled: true
  currency: team-money
  interaction-blacklist:
    - minecraft:stone_button
    - minecraft:oak_button
    - minecraft:lever
  markets:
    - id: markt
      enabled: true
      world: overworld
      min-x: -28
      min-z: 21
      max-x: -10
      max-z: 59
      trader-spawn:
        x: -19
        y: 106
        z: 40
  traders:
    automatic: true
    count-per-type: 1
    types:
      food:
        name: "§aLebensmittelhändler"
        trades:
          - buy: {item: minecraft:emerald, count: 1}
            sell: {item: minecraft:wheat, count: 16}
            max-uses: 64
            tier: 1
            trader-exp: 1
      building:
        name: "§6Baustoffhändler"
        trades:
          - buy: {item: minecraft:emerald, count: 1}
            sell: {item: minecraft:oak_log, count: 16}
            max-uses: 64
            tier: 1
            trader-exp: 1
      resources:
        name: "§7Rohstoffhändler"
        trades:
          - buy: {item: minecraft:emerald, count: 1}
            sell: {item: minecraft:coal, count: 16}
            max-uses: 64
            tier: 1
            trader-exp: 1
      tools:
        name: "§bWerkzeughändler"
        trades:
          - buy: {item: minecraft:emerald, count: 2}
            sell: {item: minecraft:stone_pickaxe, count: 1}
            max-uses: 32
            tier: 1
            trader-exp: 1
      weapons:
        name: "§cWaffenhändler"
        trades:
          - buy: {item: minecraft:emerald, count: 6}
            sell: {item: minecraft:iron_sword, count: 1}
            max-uses: 16
            tier: 1
            trader-exp: 3
      supplies:
        name: "§dVersorgungshändler"
        trades:
          - buy: {item: minecraft:emerald, count: 1}
            sell: {item: minecraft:wheat_seeds, count: 16}
            max-uses: 64
            tier: 1
            trader-exp: 1
      soldiers:
        name: "§cSoldatenhändler"
        trades:
          - buy: {item: minecraft:emerald, count: 8}
            sell: {item: minecraft:iron_sword, count: 1}
            max-uses: 16
            tier: 1
            trader-exp: 3
      enchantments:
        name: "§5Verzauberungshändler"
        trades:
          - buy: {item: minecraft:emerald, count: 5}
            buy2: {item: minecraft:book, count: 1}
            sell: {item: minecraft:enchanted_book, count: 1}
            max-uses: 16
            tier: 1
            trader-exp: 2

mines:
  enabled: false
  fuse-seconds: 1
  rearm-seconds: 15

antiafk:
  enabled: true
  timeout-minutes: 15
  warning-seconds: 60
  # Players with this permission are excluded from Anti-AFK.
  exempt-permission: siedler.admin


# PvP tournament system
# All coordinates are configurable. Worlds must be loaded by the server.
tournament:
  enabled: true
  registration:
    duration-seconds: 120
    min-participants: 2
    max-participants: 16
    auto-start-when-full: true
  start-countdown-seconds: 10
  match-countdown-seconds: 5
  protection:
    # Prevents participants from fighting anyone except their current bracket opponent.
    cancel-player-damage-outside-matches: true
  match:
    # Prevents normal inventory/XP loss when a tournament participant dies.
    keep-inventory: true
  rewards:
    # Optional console command. Use {player} for the winner's name.
    # Example: "give {player} diamond 8"
    command: ""
  lobby:
    world: overworld
    x: 0
    y: 100
    z: 0
  arena:
    spawn-a:
      world: overworld
      x: 100
      y: 100
      z: 100
    spawn-b:
      world: overworld
      x: 120
      y: 100
      z: 100
    spectator:
      world: overworld
      x: 110
      y: 110
      z: 120
  kits:
    # Default kit used when a player does not select another kit.
    default: warrior
    # Kit commands are executed by the server console. {player} is replaced with the player name.
    # Each kit starts with an automatic inventory clear.
    warrior:
      commands:
        - "give {player} minecraft:iron_sword 1"
        - "give {player} minecraft:shield 1"
        - "give {player} minecraft:iron_helmet 1"
        - "give {player} minecraft:iron_chestplate 1"
        - "give {player} minecraft:iron_leggings 1"
        - "give {player} minecraft:iron_boots 1"
        - "give {player} minecraft:cooked_beef 16"
        - "effect {player} resistance 99999 0 true"
    archer:
      commands:
        - "give {player} minecraft:bow 1"
        - "give {player} minecraft:arrow 32"
        - "give {player} minecraft:iron_sword 1"
        - "give {player} minecraft:leather_helmet 1"
        - "give {player} minecraft:leather_chestplate 1"
        - "give {player} minecraft:leather_leggings 1"
        - "give {player} minecraft:leather_boots 1"
        - "give {player} minecraft:cooked_beef 16"
    tank:
      commands:
        - "give {player} minecraft:diamond_sword 1"
        - "give {player} minecraft:shield 1"
        - "give {player} minecraft:diamond_helmet 1"
        - "give {player} minecraft:diamond_chestplate 1"
        - "give {player} minecraft:diamond_leggings 1"
        - "give {player} minecraft:diamond_boots 1"
        - "give {player} minecraft:cooked_beef 24"
        - "effect {player} resistance 99999 1 true"
